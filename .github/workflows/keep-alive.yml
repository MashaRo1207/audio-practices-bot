name: Keep Render Bot Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bot URL to prevent Render free-tier sleep
        run: curl -s -o /dev/null -w "HTTP status: %{http_code}\n" https://audio-practices-bot.onrender.com || true
